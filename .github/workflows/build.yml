name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # git-commit-id-plugin reads the commit history.
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build release jar and exe
        run: mvn -B clean package -DskipTests

      - name: Build dev jar and exe
        run: mvn -B package -P debug

      - name: Run tests
        run: mvn -B verify

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: MineOnline
          path: |
            target/MineOnline-*.jar
            target/MineOnline-*.exe
          if-no-files-found: error
